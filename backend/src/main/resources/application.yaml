server:
  port: 8080

spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5432/taskdb
    username: imh
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    defer-datasource-initialization: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

  app:
    frontend-url: http://localhost:3000

  mail:
    host: smtp.gmail.com
    port: 587
    username: test@gmail.com
    password: 111##
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true